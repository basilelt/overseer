const TYPED = 'overseer', TK = i => 0.2 + i * 0.06;

let IN, AMBG;
function introInit() {

const gridW = t => { if (t >= bt(10) && t < bt(12)) grid(5.625 + (t - bt(10)) * 2); };
const SCENES = [intro, reel, orbitW, gridW, tasks, quorum, review, hosts, devices, montage, logo];
function drawAll(t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  G.setTransform(1, 0, 0, 1, 0, 0); G.clearRect(0, 0, W / 2, H / 2);
  background(t);

}
function aberr(px) {
  const cols = ['#ff0000', '#00ff00', '#0000ff'];
  AB.forEach((cnv, j) => { const g = cnv.getContext('2d'); g.globalCompositeOperation = 'source-over'; g.drawImage(cv, 0, 0); g.globalCompositeOperation = 'multiply'; g.fillStyle = cols[j]; g.fillRect(0, 0, W, H); });

  O.globalCompositeOperation = 'lighter';
  AB.forEach((cnv, j) => { const s = 1 + (j - 1) * px / 1920; O.save(); O.translate(960, 540); O.scale(s, s); O.translate(-960, -540); O.drawImage(cnv, 0, 0); O.restore(); });

}
function renderFrame(i, samples = 1) {
  const t0 = i / FPS;
  O.setTransform(1, 0, 0, 1, 0, 0); O.globalAlpha = 1; O.globalCompositeOperation = 'source-over';
  O.fillStyle = C.bg; O.fillRect(0, 0, W, H);
  for (let s = 0; s < samples; s++) {
    const t = clamp(samples > 1 ? t0 + ((s + 0.5) / samples - 0.5) * SHUTTER / FPS : t0, 0, DUR - 1e-4) * K;
    drawAll(t);
    const k = shake(t);
    O.save(); O.globalAlpha = 1 / (s + 1);
    O.translate(960 + k.x, 540 + k.y); O.rotate(k.r); O.scale(k.z, k.z); O.translate(-960, -540);
    O.drawImage(SC, 0, 0); O.restore();
  }
  hud(O, t0 * K, t0);
  O.save();
  O.fillStyle = VIG; O.fillRect(0, 0, W, H);
  const ab = aberrAmt(t0 * K);
  if (ab > 0.4) aberr(ab);
  O.globalCompositeOperation = 'overlay'; O.globalAlpha = 0.07; O.fillStyle = GR[i % GR.length]; O.fillRect(0, 0, W, H);
  O.globalCompositeOperation = 'source-over';
  const f = P(t0 * K, 14.8, 14.97);
  if (f > 0) { O.globalAlpha = E.io2(f); O.fillStyle = C.bg; O.fillRect(0, 0, W, H); }
  O.restore();
}

if (RENDER) document.body.classList.add('render');
const ready = (async () => {
  await Promise.all(FONTS.map(async ([fam, file, w]) => { const f = new FontFace(fam, `url(fonts/${file}.woff2)`, { weight: String(w) }); await f.load(); document.fonts.add(f); }));
  await Promise.all(Object.entries(SHOTS).map(([k, f]) => new Promise((res, rej) => { const im = new Image(); im.onload = () => { SH[k] = im; res(); }; im.onerror = () => rej(new Error('image ' + f)); im.src = `shots/${f}.png`; })));
  fxInit(); introInit(); reelInit(); slotInit();
})();
window.reel = { ready, fps: FPS, duration: DUR, width: W, height: H, frame(i, samples = 1, type = 'image/png', q) { renderFrame(i, samples); return cv.toDataURL(type, q); }, draw: renderFrame };

const pp = document.getElementById('pp'), sk = document.getElementById('sk'), tcl = document.getElementById('tc'), alt = document.getElementById('alt');
sk.max = DUR * FPS - 1;
if (DUR === 30) { alt.href = 'reel.html'; alt.textContent = '15 s cut'; }
let playing = false, start = 0, cur = clamp(parseFloat(Q.get('t')) || 0, 0, DUR - 1 / FPS);
function show() { const i = Math.min(DUR * FPS - 1, Math.floor(cur * FPS)); renderFrame(i, 1); sk.value = i; tcl.textContent = `${cur.toFixed(2)} s`; }
function tick(now) { if (!playing) return; cur = ((now - start) / 1000) % DUR; show(); requestAnimationFrame(tick); }
function play(on) { playing = on; pp.textContent = on ? 'Pause' : 'Play'; if (on) { start = performance.now() - cur * 1000; requestAnimationFrame(tick); } }
pp.onclick = () => play(!playing);
sk.oninput = () => { play(false); cur = sk.value / FPS; show(); };
addEventListener('keydown', e => {
  if (e.target === sk && e.key.startsWith('Arrow')) return;
  if (e.key === ' ') { e.preventDefault(); play(!playing); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { play(false); cur = clamp(cur + (e.key === 'ArrowRight' ? 1 : -1) / FPS, 0, DUR - 1 / FPS); show(); }
});
ready.then(() => { if (RENDER) return; show(); if (!Q.has('t') && !matchMedia('(prefers-reduced-motion: reduce)').matches) play(true); else play(false); }).catch(e => { tcl.textContent = String(e); });
