@font-face{font-family:Inter;src:url(fonts/Inter-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/Inter-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/Inter-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Inter Display";src:url(fonts/InterDisplay-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/JetBrainsMono-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--bg:#0b0b0c;--surface:#141416;--hover:#1c1c1f;--border:#232327;--border-strong:#2f2f34;--text:#ededef;--text-2:#a1a1aa;--text-3:#63636b;--amber:#e8a33a;--blue:#3b82f6;--gutter:24px;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;color:var(--text);background:radial-gradient(70% 45% at 50% 0%,rgba(232,163,58,.07),transparent 70%),var(--bg);font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:min(100% - 2 * var(--gutter),1180px,max(560px,calc((100svh - 300px) * 16 / 9)));margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
h1{margin:0}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 19px/1 "Inter Display",Inter,sans-serif;letter-spacing:-.01em}
.brand svg{width:28px;height:28px;flex:none}
.tag{font:400 12px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
main{flex:1;display:flex;flex-direction:column;align-items:center}
.reel{width:100%;margin:0}
.stage{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;isolation:isolate;background:#000;border:1px solid var(--border-strong);box-shadow:0 30px 90px -30px rgba(0,0,0,.9),0 0 140px -40px rgba(232,163,58,.35);cursor:pointer}
.stage video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.big{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:rgba(11,11,12,.6);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transform:scale(.88);transition:opacity .2s,transform .2s;pointer-events:none}
.big svg{width:28px;height:28px;margin-left:4px}
.paused .big{opacity:1;transform:none}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.group{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font:500 14px/1 Inter,system-ui,sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color .14s,border-color .14s,color .14s}
.btn:hover{background:var(--hover);border-color:#3c3c43}
.btn:focus-visible,.brand:focus-visible,footer a:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
.btn svg{width:16px;height:16px;flex:none}
.btn[aria-pressed=true]{color:#f5c77e;border-color:rgba(232,163,58,.5);background:rgba(232,163,58,.1)}
.btn[aria-pressed=true] .off,.btn[aria-pressed=false] .on,.paused .i-pause,.reel:not(.paused) .i-play{display:none}
.seg{display:flex}
.seg .btn{border-radius:0;min-width:64px}
.seg .btn:first-child{border-radius:8px 0 0 8px}
.seg .btn:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.copy{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:44px}
.lede{margin:0;max-width:640px;font:500 clamp(18px,2.1vw,22px)/1.45 Inter,system-ui,sans-serif;letter-spacing:-.01em;text-wrap:balance}
.lede span{color:var(--text-2)}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.btn.primary{height:42px;padding:0 18px;background:var(--amber);border-color:var(--amber);color:#18181b;font-weight:600}
.btn.primary:hover{background:#f1b551;border-color:#f1b551}
.cta .btn:not(.primary){height:42px;padding:0 18px}
footer{padding:56px 0 28px;text-align:center;font-size:13px;color:var(--text-3)}
footer a{color:inherit;text-decoration:none;border-bottom:1px solid var(--border-strong)}
footer a:hover{color:var(--text-2)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-width:560px){
  :root{--gutter:16px}
  header{padding:14px 0}
  .bar{justify-content:center}
  .group{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  .seg{width:100%}
  .seg .btn{flex:1}
  .copy{margin-top:32px}
  .cta{width:100%}
  .cta .btn{flex:1 1 140px}
}
@media (prefers-reduced-motion:reduce){.big,.btn{transition:none}}

<body>
<header class="wrap">
  <h1><a class="brand" href="https://github.com/basilelt/overseer"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#18181b"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-dasharray="4 5" opacity=".55"/><circle cx="32" cy="32" r="8" fill="none" stroke="#fafafa" stroke-width="4"/><circle cx="32" cy="32" r="3" fill="#e8a33a"/><circle cx="32" cy="15" r="4.5" fill="#fafafa"/><circle cx="46.7" cy="40.5" r="4.5" fill="#fafafa"/><circle cx="17.3" cy="40.5" r="4.5" fill="#fafafa"/></svg>Overseer</a></h1>
  <span class="tag">Showreel</span>
</header>
<main class="wrap">
  <figure class="reel" id="reel">
    <div class="stage" id="stage">
      <video id="v" autoplay muted loop playsinline controls preload="auto" poster="poster.jpg" aria-label="Overseer showreel" aria-describedby="desc">
        <source src="overseer-showreel-30s.webm" type='video/webm; codecs="vp9, opus"'>
        <source src="overseer-showreel-30s.mp4" type="video/mp4">
      </video>
      <script>
        (function () {
          var v = document.getElementById('v');
          v.controls = false;
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
            v.autoplay = false;
            v.removeAttribute('autoplay');
            v.pause();
          }
        })();
      </script>
      <span class="big" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4.5 2.75v10.5L13 8z" fill="currentColor"/></svg></span>
    </div>
    <figcaption class="sr" id="desc">A 30-second motion graphics reel, with a faster 15-second cut: a terminal launches Overseer, the names of supported coding agents spin past, sessions orbit a central core, live terminals, a task board and a code review animate in, the app moves from desktop to phone and server, and the Overseer logo assembles.</figcaption>
    <div class="bar">
      <div class="group">
        <button class="btn" id="play" type="button" aria-label="Pause">
          <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.25 3h2.5v10h-2.5zM9.25 3h2.5v10h-2.5z" fill="currentColor"/></svg>
          <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.75v10.5L13 8z" fill="currentColor"/></svg>
          <span id="playLabel">Pause</span>
        </button>
        <button class="btn" id="sound" type="button" aria-pressed="false">
          <svg class="off" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 6h2.5L7.75 3v10l-3.5-3h-2.5z" fill="currentColor"/><path d="M10.5 6l4 4m0-4l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <svg class="on" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 6h2.5L7.75 3v10l-3.5-3h-2.5z" fill="currentColor"/><path d="M10.25 5.5a3.5 3.5 0 0 1 0 5M12.25 3.5a6.4 6.4 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Sound
        </button>
        <button class="btn" id="replay" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.75 8a5.25 5.25 0 1 0 1.55-3.72" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2.5 2.25v3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Replay
        </button>
      </div>
      <div class="seg" role="group" aria-label="Length">
        <button class="btn" type="button" data-cut="30" aria-pressed="true">30 s</button>
        <button class="btn" type="button" data-cut="15" aria-pressed="false">15 s</button>
      </div>
    </div>
  </figure>
  <section class="copy">
    <p class="lede">Overseer runs and supervises your AI coding agents side by side, <span>locally or on a server over SSH.</span></p>
    <div class="cta">
      <a class="btn primary" href="https://github.com/basilelt/overseer/releases/latest">Get Overseer</a>
      <a class="btn" href="https://github.com/basilelt/overseer">GitHub
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </section>
</main>

<script>
  (function () {
    var v = document.getElementById('v');
    var reel = document.getElementById('reel');
    var stage = document.getElementById('stage');
    var play = document.getElementById('play');
    var label = document.getElementById('playLabel');
    var sound = document.getElementById('sound');
    var unmuted = false;
    var pending = v.autoplay;
    function sync() {
      var p = v.paused && !pending;
      reel.classList.toggle('paused', p);
      label.textContent = p ? 'Play' : 'Pause';
      play.setAttribute('aria-label', p ? 'Play' : 'Pause');
      sound.setAttribute('aria-pressed', String(!v.muted));
    }
    function settle() {
      pending = false;
      sync();
    }
    function start() {
      var r = v.play();
      if (r && r.then) r.then(null, settle);
    }
    function toggle() {
      if (v.paused) start(); else v.pause();
    }
    ['play', 'pause', 'volumechange'].forEach(function (e) { v.addEventListener(e, settle); });
    play.addEventListener('click', toggle);
    stage.addEventListener('click', toggle);
    sound.addEventListener('click', function () {
      v.muted = !v.muted;
      if (!v.muted) {
        if (!unmuted) { unmuted = true; v.currentTime = 0; }
        start();
      }
      sync();
    });
    var cuts = { '30': 'overseer-showreel-30s', '15': 'overseer-showreel' };
    var segs = [].slice.call(document.querySelectorAll('[data-cut]'));
    segs.forEach(function (b) {
      b.addEventListener('click', function () {
        if (b.getAttribute('aria-pressed') === 'true') return;
        var run = !(v.paused && !pending), s = v.querySelectorAll('source'), base = cuts[b.dataset.cut];
        segs.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
        s[0].src = base + '.webm';
        s[1].src = base + '.mp4';
        v.load();
        if (run) start();
        sync();
      });
    });
    document.getElementById('replay').addEventListener('click', function () {
      v.currentTime = 0;
      start();
    });
    sync();
    if (pending) start();
  })();
</script>
