[package]
name = "overseer-app"
version = "0.30.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/basilelt/overseer"
publish = false

[lib]
name = "overseer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Linux stack (wry, tao, gtk 0.18) pins glib 0.18, flagged by RUSTSEC-2024-0429 (fixed in 0.20).
# The Dependabot security update for glib fails until Tauri moves to gtk-rs >= 0.20; still waiting on Tauri.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros", "process", "fs", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.11"
dirs = "7"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
ring = "0.17"
semver = "1"
webpki-root-certs = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1"
android-native-keyring-store = "1"

[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["protected"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
