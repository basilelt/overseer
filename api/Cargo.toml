[package]
name = "overseer-api"
version = "0.33.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/basilelt/overseer"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tungstenite = "0.30"

[profile.release]
strip = true
