name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you installed, or the output of `overseer version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [macOS, Linux, Windows, Android, iOS, Remote over SSH]
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Coding agent and version
      placeholder: claude 2.1.289, codex 0.50.0, ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the app or daemon logs. Remove tokens, paths and anything private.
      render: text
