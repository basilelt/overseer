name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      app: ${{ steps.filter.outputs.app }}
      windows: ${{ steps.filter.outputs.windows }}
      android: ${{ steps.filter.outputs.android }}
      macos_signing: ${{ steps.filter.outputs.macos_signing }}
      macos_procs: ${{ steps.filter.outputs.macos_procs }}
      actionlint: ${{ steps.filter.outputs.actionlint }}
      store_guard: ${{ steps.filter.outputs.store_guard }}
      tap: ${{ steps.filter.outputs.tap }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SKIP: ${{ inputs.skip }}
        run: scripts/ci-changes.sh

  actionlint:
    needs: changes
    if: needs.changes.outputs.actionlint == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/actionlint
          key: actionlint-1.7.12-${{ runner.os }}-${{ runner.arch }}

      - if: steps.actionlint.outputs.cache-hit != 'true'
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          mkdir -p ~/.cache/actionlint
          tar xzf actionlint.tar.gz -C ~/.cache/actionlint actionlint

      - run: ~/.cache/actionlint/actionlint -color

  ci-scripts:
    needs: changes
    if: needs.changes.outputs.ci_scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: scripts/ci-changes.test.sh

      - run: scripts/check-version.test.sh

      - env:
          CI_APT_TEST_IMAGE: mirror.gcr.io/library/ubuntu:24.04
        run: scripts/ci-apt.test.sh

      - name: The setup action installs from a warm apt archive
        uses: ./.github/actions/setup
        with:
          apt: tmux xvfb
          check: tmux xvfb-run

  gitleaks:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      VERSION: 8.30.1
      SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: |
          curl -fsSL --retry 5 --retry-all-errors -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks

      - run: ./gitleaks git --redact --no-banner --log-opts="${BASE}..${HEAD}" .

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          apt: tmux
          rust: "true"
          rust-components: clippy, rustfmt
          rust-workspaces: |
            . -> target
            api -> api/target
          check: cargo cargo-fmt cargo-clippy tmux git ssh ssh-keygen

      - run: cargo fetch --locked && cargo fetch --locked --manifest-path api/Cargo.toml

      - run: cargo fmt --check && cargo fmt --check --manifest-path api/Cargo.toml

      - run: make lint

      - run: timeout 1500 make test


  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          free-disk: all
          apt: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev pkg-config patchelf tmux
          rust: "true"
          rust-components: clippy
          rust-workspaces: |
            . -> target
            app/src-tauri -> target
          node: "true"
          check: cargo cargo-clippy pnpm pkg:webkit2gtk-4.1 pkg:gtk+-3.0 pkg:librsvg-2.0

      - run: cargo fetch --locked

      - run: make app-test


  perf:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          free-disk: all
          apt: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev pkg-config patchelf xvfb dbus-x11
          rust: "true"
          rust-workspaces: app/src-tauri -> target
          node: "true"
          check: cargo pnpm xvfb-run pkg:webkit2gtk-4.1 pkg:gtk+-3.0 pkg:librsvg-2.0

      - name: Release build of the app against the mock backend
        env:
          VITE_MOCK: "1"
          VITE_PERF: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: pnpm --dir app tauri build --no-bundle --ci

      - name: CPU budget (30 s idle, 30 s streaming)
        run: xvfb-run -a -s "-screen 0 1440x900x24" scripts/perf-cpu.sh app/src-tauri/target/release/overseer-app


  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-components: clippy

      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --lib --bins -- -D warnings


  tap:
    needs: changes
    if: needs.changes.outputs.tap == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - run: scripts/update-tap.test.sh

  macos:
    needs: changes
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (needs.changes.outputs.macos_signing == 'true' || needs.changes.outputs.macos_procs == 'true')
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sign two builds with a throwaway Overseer Self-Signed identity
        if: needs.changes.outputs.macos_signing == 'true'
        shell: bash
        run: |
          d=$(mktemp -d)
          ossl=/usr/bin/openssl
          if prefix=$(brew --prefix openssl@3 2>/dev/null) && [ -x "$prefix/bin/openssl" ]; then
            ossl="$prefix/bin/openssl"
          fi
          legacy=()
          if "$ossl" version | grep -q '^OpenSSL 3'; then
            legacy=(-legacy)
          fi
          cat >"$d/cert.cnf" <<'CNF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = Overseer Self-Signed
          O = Overseer CI
          [ext]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          subjectKeyIdentifier = hash
          CNF
          "$ossl" req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes -config "$d/cert.cnf" -keyout "$d/key.pem" -out "$d/cert.pem"
          pw=$("$ossl" rand -hex 16)
          "$ossl" pkcs12 -export "${legacy[@]}" -inkey "$d/key.pem" -in "$d/cert.pem" -name "Overseer Self-Signed" -out "$d/id.p12" -passout "pass:$pw"
          rm "$d/key.pem"
          SIGN_P12_BASE64=$(base64 -i "$d/id.p12" | tr -d '\n') SIGN_P12_PASSWORD=$pw scripts/macos-sign.sh import >"$d/identity"
          identity=$(cat "$d/identity")
          for v in 1 2; do
            app="$d/v$v/Overseer.app"
            mkdir -p "$app/Contents/MacOS"
            cp /usr/bin/true "$app/Contents/MacOS/overseer-app"
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>io.github.basilelt.overseer</string><key>CFBundleExecutable</key><string>overseer-app</string><key>CFBundleShortVersionString</key><string>0.0.%s</string></dict></plist>\n' "$v" >"$app/Contents/Info.plist"
            codesign --force --timestamp -s "$identity" "$app"
            scripts/macos-sign.sh verify "$app" selfsigned
            codesign -d -r- "$app" 2>&1 | grep designated >"$d/dr$v"
          done
          cmp "$d/dr1" "$d/dr2"
          echo "two different builds share one designated requirement: $(cat "$d/dr1")"

      - if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true

      - if: needs.changes.outputs.macos_procs == 'true'
        uses: ./.github/actions/setup
        with:
          rust: "true"

      - if: needs.changes.outputs.macos_procs == 'true'
        run: "cargo test --lib -- procs:: ports:: review::watch::"

  release-version:
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Same paths as scripts/release-gate.sh: a docs-only release makes no tag.
      - id: code
        shell: bash
        run: |
          if grep -qvE '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$' < <(git diff --name-only HEAD^1 HEAD); then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=release version::docs-only, no release, nothing to check"
          fi

      # Same settings as the tag step of release.yml; dry_run only computes the version.
      - id: tag_version
        if: steps.code.outputs.release == 'true'
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          rolling_tags: true
          dry_run: true

      # On a pull request the action appends -<sha> to the version; the release tags without it.
      - if: steps.code.outputs.release == 'true' && steps.tag_version.outputs.new_version != ''
        env:
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: scripts/check-version.sh "${NEW_VERSION%%-*}"

      - if: steps.code.outputs.release == 'true' && steps.tag_version.outputs.new_version == ''
        run: echo "::notice title=release version::no eligible commits, no release, nothing to check"

  store-guard:
    needs: changes
    if: needs.changes.outputs.store_guard == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: scripts/store-guard.sh

      - run: scripts/store-guard.test.sh

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          free-disk: keep-android
          rust: "true"
          rust-workspaces: app/src-tauri -> target
          node: "true"
          java: "true"
          gradle: "true"
          check: cargo rustup pnpm java env:ANDROID_HOME env:JAVA_HOME

      - run: NDK_HOME=${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}} scripts/android-env.sh aarch64-linux-android

      - run: pnpm --dir app tauri android build --ci --debug --apk --target aarch64

      - run: |
          ANDROID_CERT_SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android | sed -n 's/^.*SHA256: *//p' | head -1)
          test -n "$ANDROID_CERT_SHA256"
          ANDROID_CERT_SHA256=$ANDROID_CERT_SHA256 scripts/android-apk.sh debug out/overseer-debug-arm64.apk

      - run: scripts/android-16k.test.sh

      - run: scripts/android-16k.sh out/overseer-debug-arm64.apk

      - if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-debug-apk
          path: out/
          if-no-files-found: error
          retention-days: 4
