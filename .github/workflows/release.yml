name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  XWIN_ARCH: x86_64

jobs:
  gate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      release: ${{ steps.gate.outputs.release == 'true' && steps.tagged.outputs.tagged != 'true' }}
      skip_ci: ${{ steps.gate.outputs.skip_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: scripts/release-gate.sh

      - name: Commit already released
        id: tagged
        shell: bash
        run: |
          git fetch --tags --force --quiet
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1)
          if [ -n "$tag" ]; then
            echo "::notice title=release gate::HEAD is already tagged $tag, no release"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

  # Skipping ci itself would skip every job after tag too (success() also looks at skipped ancestors).
  ci:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      skip: ${{ needs.gate.outputs.skip_ci == 'true' }}

  tag:
    needs: [gate, ci]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
      version: ${{ steps.tag_version.outputs.new_version }}
      android: ${{ steps.optional.outputs.android }}
      play: ${{ steps.optional.outputs.play }}
      ios: ${{ steps.optional.outputs.ios }}
      tap: ${{ steps.optional.outputs.tap }}
      msix: ${{ steps.optional.outputs.msix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Seed the first tag from Cargo.toml
        id: seed
        shell: bash
        run: |
          if [ -z "$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "tag=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          custom_tag: ${{ steps.seed.outputs.tag }}
          rolling_tags: true

      - name: Move latest
        if: steps.tag_version.outputs.new_tag != ''
        shell: bash
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          git fetch --tags --force
          git tag -f latest "$NEW_TAG"
          git push origin latest --force

      - name: Optional secrets
        id: optional
        env:
          ANDROID: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          IOS: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_KEY_ID != '' && secrets.APPLE_ISSUER_ID != '' && secrets.APPLE_KEY_CONTENT != '' && secrets.IOS_CERTIFICATE != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_MOBILE_PROVISION != '' }}
          TAP: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
          MSIX: ${{ secrets.WINDOWS_SELF_SIGN_PFX_BASE64 != '' && secrets.WINDOWS_SELF_SIGN_PFX_PASSWORD != '' }}
          UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          {
            echo "android=$ANDROID"
            echo "play=$PLAY"
            echo "ios=$IOS"
            echo "tap=$TAP"
            echo "msix=$MSIX"
          } >> "$GITHUB_OUTPUT"
          if [ "$MSIX" != "true" ]; then
            echo "::warning title=MSIX skipped::WINDOWS_SELF_SIGN_PFX_BASE64 or WINDOWS_SELF_SIGN_PFX_PASSWORD is not set: no .msix in this release (docs/ci.md)"
          fi
          if [ "$ANDROID" != "true" ]; then
            echo "::warning title=app-android skipped::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD is not set: no Android APK in this release (docs/mobile.md)"
          fi
          if [ "$ANDROID" = "true" ] && [ "$PLAY" != "true" ]; then
            echo "::warning title=Google Play skipped::PLAY_SERVICE_ACCOUNT_JSON is not set: the Android App Bundle is built but not uploaded to Google Play (docs/mobile.md)"
          fi
          if [ "$IOS" != "true" ]; then
            echo "::warning title=app-ios skipped::APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_ISSUER_ID, APPLE_KEY_CONTENT, IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD or IOS_MOBILE_PROVISION is not set: no TestFlight build (docs/mobile.md)"
          fi
          if [ "$TAP" != "true" ]; then
            echo "::warning title=tap skipped::HOMEBREW_TAP_DEPLOY_KEY is not set: the Homebrew tap is not updated (docs/ci.md)"
          fi
          if [ "$UPDATER" != "true" ]; then
            echo "::warning title=no updater signature::TAURI_SIGNING_PRIVATE_KEY is not set: no .sig files and no latest.json, installed apps do not see this update (docs/ci.md)"
          fi

  # Tags pushed with GITHUB_TOKEN trigger no workflow, so the artifacts are built in this run.
  servers:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm musl-tools

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-pc-windows-msvc

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-zigbuild,cargo-xwin

      - run: >
          scripts/ci-runner-check.sh cargo zig cargo-zigbuild cargo-xwin clang lld-link llvm-lib
          target:x86_64-unknown-linux-musl target:aarch64-unknown-linux-musl
          target:x86_64-pc-windows-msvc

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock', 'api/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ env.XWIN_ARCH }}-v1

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/set-version.sh "$VERSION"

      - run: make dist-cross

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: servers
          path: dist/
          if-no-files-found: error
          retention-days: 4

  # Built on macOS so the review watcher links FSEvents (CoreServices), which needs the Apple SDK.
  servers-macos:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/set-version.sh "$VERSION"

      - run: make dist-darwin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: servers-macos
          path: dist/
          if-no-files-found: error
          retention-days: 4

  app-linux:
    needs: [tag, servers, servers-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # linuxdeploy's bundled strip cannot read the .relr.dyn sections of recent distro libraries.
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev pkg-config patchelf file

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: >
          scripts/ci-runner-check.sh cargo pnpm patchelf file
          pkg:webkit2gtk-4.1 pkg:gtk+-3.0 pkg:ayatana-appindicator3-0.1 pkg:librsvg-2.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock', 'api/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "servers*"
          merge-multiple: true
          path: dist

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/set-version.sh "$VERSION" && make app-resources

      - run: pnpm --dir app install --frozen-lockfile

      - env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater=(--config "$GITHUB_WORKSPACE/app/src-tauri/tauri.updater.conf.json")
          fi
          pnpm --dir app tauri build --bundles deb,appimage,rpm "${updater[@]}"

      - working-directory: app/src-tauri/target/release/bundle
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp deb/*.deb appimage/*.AppImage appimage/*.AppImage.sig rpm/*.rpm "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-linux-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 4

  app-windows:
    needs: [tag, servers, servers-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis clang lld llvm cmake nasm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-xwin

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: >
          scripts/ci-runner-check.sh cargo cargo-xwin pnpm makensis clang lld-link llvm-lib llvm-rc cmake nasm
          target:x86_64-pc-windows-msvc

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock', 'api/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ env.XWIN_ARCH }}-v1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "servers*"
          merge-multiple: true
          path: dist

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/set-version.sh "$VERSION" && make app-resources

      - run: pnpm --dir app install --frozen-lockfile

      - env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater=(--config "$GITHUB_WORKSPACE/app/src-tauri/tauri.updater.conf.json")
          fi
          pnpm --dir app tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis "${updater[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-windows
          path: |
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 4

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.tag.outputs.msix == 'true'
        with:
          name: msix-input-x64
          path: app/src-tauri/target/x86_64-pc-windows-msvc/release/overseer-app.exe
          if-no-files-found: error
          retention-days: 1

  app-windows-msix:
    needs: [tag, app-windows]
    if: needs.tag.outputs.msix == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "servers*"
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: msix-input-x64
          path: msix-input

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
          MSIX_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGN_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGN_PFX_PASSWORD }}
        run: |
          scripts/app-resources.sh "$VERSION"
          scripts/msix.sh "$VERSION" x64 msix-input/overseer-app.exe "out/Overseer_${VERSION}_x64.msix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-msix-x64
          path: out/
          if-no-files-found: error
          retention-days: 4

  app-windows-arm:
    needs: [tag, servers, servers-macos]
    runs-on: windows-11-arm
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri -> target

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: scripts/ci-runner-check.sh cargo pnpm jq clang target:aarch64-pc-windows-msvc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "servers*"
          merge-multiple: true
          path: dist

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/set-version.sh "$VERSION" && scripts/app-resources.sh "$VERSION"

      - run: pnpm --dir app install --frozen-lockfile

      - env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater=(--config "$GITHUB_WORKSPACE/app/src-tauri/tauri.updater.conf.json")
          fi
          pnpm --dir app tauri build --target aarch64-pc-windows-msvc --bundles nsis "${updater[@]}"

      - if: needs.tag.outputs.msix == 'true'
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          MSIX_PFX_BASE64: ${{ secrets.WINDOWS_SELF_SIGN_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGN_PFX_PASSWORD }}
        run: >
          scripts/msix.sh "$VERSION" arm64
          app/src-tauri/target/aarch64-pc-windows-msvc/release/overseer-app.exe
          "app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/Overseer_${VERSION}_arm64.msix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-windows-arm
          path: |
            app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
            app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.msix
            app/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.cer
          if-no-files-found: error
          retention-days: 4

  app-macos:
    needs: [tag, servers, servers-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: "servers*"
          merge-multiple: true
          path: dist

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/set-version.sh "$VERSION" && make app-resources

      - run: pnpm --dir app install --frozen-lockfile

      - name: Code signing identity
        id: codesign
        shell: bash
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          DEV_ID_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          DEV_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_P12_BASE64: ${{ secrets.MACOS_SELF_SIGN_P12_BASE64 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SELF_SIGN_P12_PASSWORD }}
        run: |
          if [ "$DEVELOPER_ID" = true ]; then
            identity=$(SIGN_TRUST=0 SIGN_P12_BASE64="$DEV_ID_CERTIFICATE" SIGN_P12_PASSWORD="$DEV_ID_CERTIFICATE_PASSWORD" scripts/macos-sign.sh import)
            echo "kind=developerid" >> "$GITHUB_OUTPUT"
            echo "identity=$identity" >> "$GITHUB_OUTPUT"
          elif [ -n "$SIGN_P12_BASE64" ] && [ -n "$SIGN_P12_PASSWORD" ]; then
            identity=$(scripts/macos-sign.sh import)
            echo "kind=selfsigned" >> "$GITHUB_OUTPUT"
            echo "identity=$identity" >> "$GITHUB_OUTPUT"
          else
            echo "kind=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS ad-hoc signature::MACOS_SELF_SIGN_P12_BASE64 / MACOS_SELF_SIGN_P12_PASSWORD are not set: the app is ad-hoc signed and macOS forgets its Local Network permission on every update (docs/ci.md)"
          fi

      - env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGN_KIND: ${{ steps.codesign.outputs.kind }}
          SIGN_IDENTITY: ${{ steps.codesign.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          NOTARY_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          extra=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra+=(--config "$GITHUB_WORKSPACE/app/src-tauri/tauri.updater.conf.json")
          fi
          case "$SIGN_KIND" in
            developerid)
              export APPLE_SIGNING_IDENTITY="$SIGN_IDENTITY"
              scripts/macos-sign.sh sign-resources app/src-tauri/resources/server "$SIGN_IDENTITY"
              if [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ] || [ -z "$NOTARY_KEY_CONTENT" ]; then
                echo "::error title=macOS notarization::APPLE_KEY_ID, APPLE_ISSUER_ID and APPLE_KEY_CONTENT are required with a Developer ID (docs/ci.md)"
                exit 1
              fi
              umask 077
              printf '%s' "$NOTARY_KEY_CONTENT" > "$RUNNER_TEMP/notary.p8"
              export APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_ISSUER="$NOTARY_ISSUER_ID" APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
              ;;
            selfsigned)
              export APPLE_SIGNING_IDENTITY="$SIGN_IDENTITY"
              extra+=(--config "$GITHUB_WORKSPACE/app/src-tauri/tauri.selfsign.conf.json")
              ;;
          esac
          pnpm --dir app tauri build --target "$TARGET" --bundles app,dmg "${extra[@]}"

      - name: Check the signature
        if: steps.codesign.outputs.kind != 'adhoc'
        shell: bash
        env:
          SIGN_KIND: ${{ steps.codesign.outputs.kind }}
        run: scripts/macos-sign.sh verify app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Overseer.app "$SIGN_KIND"

      - name: Show the ad-hoc signature
        if: steps.codesign.outputs.kind == 'adhoc'
        shell: bash
        run: |
          app=app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Overseer.app
          codesign -dv --verbose=4 "$app" 2>&1 || true
          codesign -d -r- "$app" 2>&1 || true

      - name: Remove the signing keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$SIGN_KEYCHAIN" || true

      - if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/notary.p8"

      - working-directory: app/src-tauri/target/${{ matrix.target }}/release/bundle
        shell: bash
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp dmg/*.dmg "$GITHUB_WORKSPACE/out/"
          if [ -f macos/Overseer.app.tar.gz.sig ]; then
            cp macos/Overseer.app.tar.gz "$GITHUB_WORKSPACE/out/Overseer_${VERSION}_${ARCH}.app.tar.gz"
            cp macos/Overseer.app.tar.gz.sig "$GITHUB_WORKSPACE/out/Overseer_${VERSION}_${ARCH}.app.tar.gz.sig"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-macos-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 4

  app-android:
    needs: tag
    if: needs.tag.outputs.tag != '' && needs.tag.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      aab: ${{ steps.aab.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - run: scripts/ci-runner-check.sh cargo rustup pnpm java env:ANDROID_HOME env:JAVA_HOME

      - run: NDK_HOME=${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}} scripts/android-env.sh aarch64-linux-android armv7-linux-androideabi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock', 'api/Cargo.lock', 'app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/src-tauri/gen/android/**/*.gradle.kts', 'app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/set-version.sh "$VERSION"

      - run: pnpm --dir app install --frozen-lockfile

      - env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm --dir app tauri android build --ci --apk --target aarch64 --target armv7

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: scripts/android-apk.sh release "out/Overseer_${VERSION}_android.apk"

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/android-16k.sh "out/Overseer_${VERSION}_android.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-android
          path: out/
          if-no-files-found: error
          retention-days: 4

      - name: Google Play bundle
        id: aab
        continue-on-error: true
        env:
          OVERSEER_DISTRIBUTION: play
          VERSION: ${{ needs.tag.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          pnpm --dir app tauri android build --ci --aab --target aarch64 --target armv7
          scripts/android-aab.sh "play/Overseer_${VERSION}_android.aab"
          scripts/android-16k.sh "play/Overseer_${VERSION}_android.aab"

      - if: steps.aab.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: play-android
          path: play/
          if-no-files-found: error
          retention-days: 4

      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  app-android-play:
    needs: [tag, app-android]
    if: ${{ !cancelled() && needs.tag.outputs.play == 'true' && needs.app-android.outputs.aab == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: play
        env:
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
        run: scripts/android-play-track.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: play-android
          path: play

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.basilelt.overseer
          releaseFiles: play/*.aab
          track: ${{ steps.play.outputs.track }}
          status: ${{ steps.play.outputs.status }}

  app-ios:
    needs: tag
    if: needs.tag.outputs.tag != '' && needs.tag.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: scripts/store-guard.sh

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri -> target

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: command -v fastlane || brew install fastlane

      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/set-version.sh "$VERSION"

      - run: pnpm --dir app install --frozen-lockfile

      - name: Set the Apple team in the Xcode project
        working-directory: app/src-tauri/gen/apple
        run: |
          sed -i '' -E "s/(DEVELOPMENT_TEAM|DevelopmentTeam) = [^;]*;/\1 = $APPLE_TEAM_ID;/" overseer-app.xcodeproj/project.pbxproj
          sed -i '' -E "s/DEVELOPMENT_TEAM: .*/DEVELOPMENT_TEAM: $APPLE_TEAM_ID/" project.yml
          grep -c "$APPLE_TEAM_ID" overseer-app.xcodeproj/project.pbxproj

      - working-directory: app
        env:
          OVERSEER_APP_DIR: ${{ github.workspace }}/app
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: fastlane ios internal_testflight

  publish:
    needs: [tag, servers, servers-macos, app-linux, app-windows, app-windows-msix, app-windows-arm, app-macos, app-android]
    if: >
      !cancelled() && needs.tag.outputs.tag != ''
      && needs.servers.result == 'success'
      && needs.servers-macos.result == 'success'
      && needs.app-linux.result == 'success'
      && needs.app-windows.result == 'success'
      && needs.app-windows-arm.result == 'success'
      && (needs.app-windows-msix.result == 'success' || needs.app-windows-msix.result == 'skipped')
      && needs.app-macos.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: src

      - run: src/scripts/ci-runner-check.sh gh jq

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          pattern: "{servers*,app-*}"
          merge-multiple: true

      - working-directory: assets
        run: sha256sum -- * > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.tag.outputs.tag }}
          name: Overseer ${{ needs.tag.outputs.tag }}
          generateReleaseNotes: true
          artifacts: assets/*
          allowUpdates: true
          makeLatest: true

      - name: Updater manifest
        if: env.HAS_UPDATER_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERSEER_REPO: ${{ github.repository }}
          VERSION: ${{ needs.tag.outputs.version }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          src/scripts/latest-json.sh "$VERSION" latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$OVERSEER_REPO"

  tap:
    needs: [tag, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.tag.outputs.tap == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: scripts/ci-runner-check.sh gh jq git ssh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - env:
          GH_TOKEN: ${{ github.token }}
          OVERSEER_REPO: ${{ github.repository }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: scripts/update-tap.sh "$VERSION" tap

      - working-directory: tap
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          if [ -z "$(git status --porcelain -- Casks Formula)" ]; then
            echo "tap already at overseer $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks Formula
          git commit -m "overseer $VERSION"
          git push --force origin "HEAD:refs/heads/bump/overseer-$VERSION"
