const MF = 1100, MD = 1375, FZ = [3000, 6000, 9000], ARR = [11.485, 11.955, 12.425];

let MC;
function montInit() {

}
function camZ(t) {

}
function montage(t) {

}

const LG = { x: 960, y: 395, u: 300 / 64 };

const LBL = [[DROP, '01  AGENTS'], [3.75, '02  ORBIT'], [5.625, '03  SESSIONS'], [7.5, '04  TASKS + REVIEW'], [9.375, '05  ANYWHERE'], [11.25, '06  FEATURES']];
const tcode = t => { const f = Math.round(t * FPS), s = Math.floor(f / FPS), ff = f % FPS; return `00:00:${String(s).padStart(2, '0')}:${String(ff).padStart(2, '0')}`; };

  sf(c, 15, 500, 'm', 3); c.textBaseline = 'middle'; c.fillStyle = C.ink2;

  c.textAlign = 'left'; c.fillText(scramble(LBL[k][1], t, LBL[k][0], 0.22), 66, 1020);
  c.textAlign = 'right'; c.fillText('1920×1080 · 60 FPS · 128 BPM', 1854, 1020);
  c.restore();
}

const SCENES = [intro, reel, orbit, grid, tasks, devices, montage, logo];
function drawAll(t) {

function aberr(px) {

    drawAll(t);
    const k = shake(t);

const pp = document.getElementById('pp'), sk = document.getElementById('sk'), tcl = document.getElementById('tc');

function tick(now) { if (!playing) return; cur = ((now - start) / 1000) % DUR; show(); requestAnimationFrame(tick); }

pp.onclick = () => play(!playing);
sk.oninput = () => { play(false); cur = sk.value / FPS; show(); };
addEventListener('keydown', e => {
  if (e.target === sk && e.key.startsWith('Arrow')) return;
  if (e.key === ' ') { e.preventDefault(); play(!playing); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { play(false); cur = clamp(cur + (e.key === 'ArrowRight' ? 1 : -1) / FPS, 0, DUR - 1 / FPS); show(); }
